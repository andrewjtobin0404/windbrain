(function(){ var ios=false; try{ ios=/iPhone|iPad|iPod/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); }catch(eI){} var arm=/^#ok=./.test(location.hash||'')&&!/^#ok=off$/.test(location.hash||''); document.write('<link rel="manifest" href="'+((ios&&arm)?'manifest-owner.webmanifest':'manifest.webmanifest')+'">'); })();</script>

(function(){

  var ready=false, hideT=null, offShown=false; function hide(){ splash.classList.add('hide'); }
  /* v4.0: THE KEPT COPIES — wb_page {v, html, t} is the page text as the script answers ?want=page (the WB_B0 marker after var B0=null in it, the WB_HOST9 line not yet), wb_b0 {v, t, at, b} the last bundle as ?want=bundle answered it; every write in try/catch; when the storage is full (iOS gives about 5 MB) the page is dropped first and the bundle kept — a page is refetched in one call, the bundle is what the app shows first */

      return (pP||fetchJ('?want=page',20000)).then(function(p){ if(my!==gen) return; if(!(typeof p.html==='string'&&p.html.indexOf('/*WB_B0*/')>=0)) throw new Error('no page'); var np={v:String(p.v), html:p.html, t:Date.now()}; keep('wb_page',np); keep('wb_b0',nb); ready=false; if(!writeFrame(np,nb)) throw new Error('no marker'); }); /* another version, or nothing kept: the page fetched, the frame written once both are in, the kept copies replaced */
